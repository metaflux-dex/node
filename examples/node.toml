# Node config template — the file the visor passes as `mtf-node --config`.
#
# Copy to /etc/mtf/node.toml and edit the `# EDIT` fields. Values marked
# `# NETWORK` are fixed per network. All nodes on a network must share them
# identically.

[node]
id = 0                                   # EDIT: your node id
data_dir = "/var/lib/mtf-node"           # WAL + snapshots; back this up

# Your node signing key (32-byte hex). Prefer an env var or a file over an
# inline value.
#
# REQUIRED on testnet and mainnet. Without it the node fails to boot. This
# applies to EVERY node, including a read-only observer: the same key
# authenticates your node on the peer-auth port.
# Set `allow_devnet_keys = true` ONLY for local solo development. It selects a
# publicly derivable key, so it is never safe on a shared network.
# validator_key_hex = "<32-byte hex>"    # EDIT
# allow_devnet_keys = false

# Governance-vote admin socket. The `mtf-node gov` CLI connects here. There is
# no TCP transport. The socket is created 0600, and those permissions are the
# gate.
# Unset defaults to `<data_dir>/gov-admin.sock`.
# gov_admin_socket = "/var/lib/mtf-node/gov-admin.sock"
# Optional shared secret, checked in addition to the socket permissions. When
# you set it, the gov CLI needs the same token.
# gov_admin_token = "<secret>"

[network]
# EDIT: the addresses peers dial you on. The gossip, peer_rpc and auth ports
# must be reachable from the internet.
listen = { gossip = "0.0.0.0:4001", peer_rpc = "0.0.0.0:4002", auth = "0.0.0.0:4003" }

# NETWORK: the published seed peers. `pubkey_hex` is MANDATORY on testnet and
# mainnet — the node refuses to boot without it. Each key below is the
# `pubkey` field of the matching validator in networks/testnet/genesis.json.
#
# Only three of the five genesis validators publish consensus ports. Validators
# 1 and 2 do not, so they cannot be seeds.
#
# WARNING: all three seeds run on ONE machine. If that host is offline there is
# no seed at all. Treat this as a single point of failure, not as three
# independent peers.
#
# Verified reachable on 2026-08-21 by a protocol handshake against each port.
peers = [
  { id = 3, gossip = "222.167.34.66:4001", peer_rpc = "222.167.34.66:4002", auth = "222.167.34.66:4003", pubkey_hex = "03476bf897a74a4087cf63faf2a8947cc4079a3e9256ee50d9e46baeda143324ab" },
  { id = 4, gossip = "222.167.34.66:4011", peer_rpc = "222.167.34.66:4012", auth = "222.167.34.66:4013", pubkey_hex = "029c00391e32a0ee6aee0a78367da85b2596719cee3a85ad047153fde55ce28718" },
  { id = 5, gossip = "222.167.34.66:4021", peer_rpc = "222.167.34.66:4022", auth = "222.167.34.66:4023", pubkey_hex = "033f195adb23bb2ed72116b3d0990895165bba526ff634e948eb37f7c05686a4ae" },
]
# Template for one peer entry. Copy the shape, then set your own values:
# { id = 9, gossip = "host:4001", peer_rpc = "host:4002", auth = "host:4003", pubkey_hex = "<66 hex chars>" },

[consensus]
chain_id = 114514                        # NETWORK: must equal genesis.json chain_id
chain_start_ms = 1785100500000           # NETWORK: must equal genesis.json genesis_time_ms

# Target only. The observed rate is measured, not configured.
target_block_interval_ms = 100

# Floor in ms between consecutive proposals. Read only when
# `responsive_propose` is true. Default 25.
# min_block_interval_ms = 25

# Propose on round-advance instead of on the tick. Scheduling only: it changes
# WHEN a block is proposed, never WHAT is committed. Default false.
responsive_propose = false

startup_grace_secs = 15

# Explicit genesis — the published chain-creation artifact for your network
# (networks/<net>/genesis.json). The node binds its genesis block to this
# file's hash, and reads the epoch length and the active-set cap from it. Copy
# the network's genesis.json locally and point here.
genesis_file = "/etc/mtf/genesis.json"   # EDIT: local path to the network's genesis.json

# NETWORK: the genesis validator set. It must AGREE with genesis.json, which the
# node cross-checks at boot and fails closed. Take id, stake and pubkey_hex from
# genesis.json. `pubkey_hex` is MANDATORY here too on testnet and mainnet.
validators = [
  { id = 1, stake = 18200000, pubkey_hex = "0398af87ecf69c9252e071d3993dd20dcb38f969f1541e5a1e15ab4779e140823c" },
  { id = 2, stake = 13100000, pubkey_hex = "02d3edde0f22bdedafdfc020a42a204142a7efdd88faa55c07e04419e4188631f3" },
  { id = 3, stake = 10600000, pubkey_hex = "03476bf897a74a4087cf63faf2a8947cc4079a3e9256ee50d9e46baeda143324ab" },
  { id = 4, stake = 20400000, pubkey_hex = "029c00391e32a0ee6aee0a78367da85b2596719cee3a85ad047153fde55ce28718" },
  { id = 5, stake = 25300000, pubkey_hex = "033f195adb23bb2ed72116b3d0990895165bba526ff634e948eb37f7c05686a4ae" },
]

[observability]
# All three addresses below are listen addresses for YOUR node. They are not
# project-hosted endpoints. Choose ports that suit your host.
api_listen = "0.0.0.0:8080"              # REST + WebSocket
metrics_listen = "127.0.0.1:9100"
# EVM JSON-RPC. It starts ONLY when api_listen is also set, because it reuses
# the same read handle. With api_listen unset the node logs a warning and skips
# the EVM RPC.
evm_rpc_listen = "0.0.0.0:8545"

[persistence]
enabled = true

# Per-block NDJSON streams, hourly-rotated under <data_dir>. All OFF by default.
# None of them touch the app hash, so turning one on cannot fork your node.
#
# Most are REFUSED on a validator. They name the addresses behind each fill, and
# they add write load to a machine whose job is consensus. Run them on a
# dedicated non-validating node. See README, "Reading L1 data".
#
# write_trades = true            # node_trades/hourly/{date}/{hour}
# write_fills = true             # node_fills/... — de-anonymised
# write_order_statuses = true    # node_order_statuses/...
# write_funding = true           # node_funding/... — de-anonymised
# write_ledger = true            # node_ledger/... — de-anonymised
# write_equity_snapshots = true  # node_equity_snapshots/... — de-anonymised
# write_replica_cmds = true      # replica_cmds/{date}/{hour} — the block archive
#
# These two carry only public data and are EXEMPT from the validator refusal:
# write_gov = true               # node_gov/... — governance votes
# write_asset_ctxs = true        # node_asset_ctxs/... — mark, oracle, funding, OI
#
# Book diff recorders. record_l4 writes every resting order WITH its owner;
# record_l2 is the aggregated sibling — price levels only, no owner, no order id.
# record_l2 = true               # l2_book_diffs.jsonl
# record_l4 = true               # l4_book_diffs.jsonl
#
# Overrides the validator refusal above. Set it only if you accept both the
# de-anonymisation and the write load on a consensus machine.
# allow_stream_on_validator = true

# Bridge cosigner config. It applies ONLY to validators that operate the custody
# bridge. Leave the whole section out otherwise.
#
# `chain` accepts "base" or "arbitrum". No other value parses.
# `rpc_urls` is an ordered FAILOVER list. The deposit watcher moves to the next
# endpoint when one is down. `rpc_url` stays supported and comes first.
#
# WARNING: the old `[bridge_chain.bootstrap]` sub-table was DELETED. The config
# parser does not reject unknown fields, so an old block still parses and is
# then silently discarded. Delete it yourself.
#
# [[bridge_chain]]
# chain = "base"
# enabled = true
# rpc_url = "https://mainnet.base.org"
# rpc_urls = ["https://base.llamarpc.com"]
