# Run a MetaFlux node under docker. One container: the visor is PID 1 and
# supervises mtf-node as its child.
#
# Place visor.toml + node.toml next to this file (copied from networks/ and
# examples/), then: docker compose up -d
#
# NOTE: docker's restart policy cannot distinguish the visor's intentional
# exit 78 (halt) from a crash, so it will restart on a halt. For a production
# validator prefer the systemd unit (deploy/mtf-visor.service), which honors
# exit 78 via RestartPreventExitStatus.

services:
  mtf-visor:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        ARCH: x86_64-unknown-linux-musl
        VISOR_VERSION: latest
    restart: on-failure
    stop_grace_period: 45s
    ports:
      - "4001:4001"   # gossip   (public)
      - "4002:4002"   # peer rpc (public)
      - "4003:4003"   # auth     (public)
      - "8080:8080"   # REST + WebSocket
      - "8545:8545"   # EVM JSON-RPC
    volumes:
      - ./visor.toml:/etc/mtf/visor.toml:ro
      - ./node.toml:/etc/mtf/node.toml:ro
      - mtf-visor-home:/var/lib/mtf-visor
      - mtf-node-data:/var/lib/mtf-node

volumes:
  mtf-visor-home:
  mtf-node-data:
