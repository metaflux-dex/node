# mtf-visor config — MetaFlux MAINNET (chain_id 8964).
#
# Copy to /etc/mtf/visor.toml and edit the `# EDIT` fields. Mainnet requires a
# release_threshold of at least 2: a single release key must never be able to
# push a binary network-wide.

chain = "mainnet"

[node]
config = "/etc/mtf/node.toml"   # EDIT: your node config (see examples/node.toml)
extra_args = []

[paths]
home = "/var/lib/mtf-visor"

[supervisor]
stable_secs = 60
backoff_initial_ms = 500
backoff_max_secs = 30
backoff_multiplier = 2
shutdown_grace_secs = 10
post_swap_health_secs = 120

[log]
max_mb = 256
keep = 10
total_mb = 4096
min_free_mb = 2048
passthrough = true

[update]
manifest_url = "https://binaries.mtf.exchange/mainnet/node/manifest.json"
# EDIT at launch: the published mainnet release-signing public keys (>= 2).
release_pubkeys = ["<mainnet-release-pubkey-1>", "<mainnet-release-pubkey-2>"]
release_threshold = 2           # mainnet floor; the visor refuses < 2 here
poll_secs = 30
request_timeout_secs = 30
allowed_hosts = ["binaries.mtf.exchange"]

[upgrade]
enabled = true
info_url = "http://127.0.0.1:8080"
poll_secs = 2

[observability]
metrics_listen = "127.0.0.1:9110"
