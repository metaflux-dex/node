# mtf-visor config — MetaFlux TESTNET (chain_id 114514).
#
# Copy to /etc/mtf/visor.toml and edit the `# EDIT` fields. The visor passes
# [node].config verbatim to `mtf-node`; everything else governs supervision and
# the signature-verified auto-update.

chain = "testnet"
# Pinned chain identity — the published genesis hash (networks/testnet/genesis.hash).
# The visor halts a node whose reported genesis_hash differs (booted on the wrong
# chain). The chain was created again on 2026-09-01. This value is the new chain.
genesis_hash = "8f6fce34e462c5532f41280d3b262fe76013ce1a1d92dd2470b55bb28ec2102f"

[node]
config = "/etc/mtf/node.toml"   # EDIT: your node config (see examples/node.toml)
extra_args = []

[paths]
home = "/var/lib/mtf-visor"      # staged binaries, journal, rotated logs, current symlink

[supervisor]
stable_secs = 60
backoff_initial_ms = 500
backoff_max_secs = 30
backoff_multiplier = 2
shutdown_grace_secs = 10
post_swap_health_secs = 120

[log]
max_mb = 256
keep = 10
total_mb = 4096
min_free_mb = 2048
passthrough = true

# Signature-verified auto-update. The visor polls this manifest, verifies the
# threshold signature against release_pubkeys, checks the chain binding, and
# stages the matching binary. The binary URL is signed inside the manifest, so it
# cannot be redirected. See docs/VERIFYING.md for both verification layers.
[update]
manifest_url = "https://binaries.mtf.exchange/testnet/node/manifest.json"
# Testnet release-signing public key (secp256k1). Layer 1 of two.
release_pubkeys = ["03e379c8f5505e7627f0232fa06a72bc47560def9e85ef5cda3a64696306e43b34"]
release_threshold = 1
# Layer 2: the offline GPG root key. The visor imports this file into an isolated
# keyring, then checks each staged binary's detached .asc signature against it.
# The visor REFUSES to start an [update] section without this field, on every
# network.
#
# Fetch this key from a RELEASE directory, NOT from the unversioned path: that
# one still serves the previous chain's root, which verifies no release of this
# chain and whose own fingerprint check passes. The fingerprint that identifies
# the correct key is 04781F5109BA16B3CCB43D1E66E38A32E5A25D73.
# See docs/VERIFYING.md.
release_gpg_pubkey = "/etc/mtf/pub_key.asc"
poll_secs = 30
request_timeout_secs = 30
allowed_hosts = ["binaries.mtf.exchange"]

# Swap-at-height. Safe to enable: the visor only swaps when the node halts at the
# governance-set freeze and a verified matching binary is staged.
# The visor reads the node's upgrade state over the node's own API. Set info_url
# to the api_listen address in YOUR node.toml. It is a local call, not a public
# endpoint.
[upgrade]
enabled = true
info_url = "http://127.0.0.1:8080"
poll_secs = 2

[observability]
metrics_listen = "127.0.0.1:9110"
